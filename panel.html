<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi panel | Banco de Apuntes</title>
  <link rel="icon" href="img/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="panel">
  <div id="site-header"></div>
  <main>
    <section class="page-hero compact"><div class="container">
      <span class="kicker">Gestión de materiales</span><h1>Mi <span class="gradient-text">panel.</span></h1><p>Consulta, edita y elimina los materiales que has compartido.</p></div></section>
    <section class="section"><div class="container">
      <div class="panel-bar">
        <label class="search-box"><span>⌕</span><input id="panel-search" type="search" placeholder="Buscar en mis materiales..." aria-label="Buscar en mis materiales"></label>
        <select id="panel-subject" aria-label="Filtrar por materia"><option value="all">Todas las materias</option>
          <option value="prog">Programación</option><option value="mate">Matemáticas</option><option value="bd">Bases de datos</option><option value="lengua">Lenguaje</option></select>
        <a href="subir.html" class="btn btn-primary">＋ Nuevo material</a>
      </div>
      <p class="muted" id="panel-count"></p>
      <div class="table-wrap"><table class="data-table"><thead><tr>
        <th>Título</th><th>Materia</th><th>Tipo</th><th>Autor</th><th>Fecha</th><th>Vistas</th><th>Acciones</th></tr></thead>
        <tbody id="panel-body"></tbody></table></div>
      <div id="panel-empty" class="empty-state" hidden><div class="empty-icon">▤</div><h3>Aún no hay materiales</h3>
        <p>Comparte tu primer apunte con la comunidad.</p><a href="subir.html" class="btn btn-primary">Compartir material</a></div>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
