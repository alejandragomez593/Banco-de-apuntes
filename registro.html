<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | Banco de Apuntes</title>
  <link rel="icon" href="img/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="registro">
  <div id="site-header"></div>
  <main>
    <section class="page-hero compact"><div class="container">
      <span class="kicker">Únete a la comunidad</span><h1>Crea tu <span class="gradient-text">cuenta.</span></h1><p>Regístrate para compartir apuntes y guardar tus recursos.</p></div></section>
    <section class="section"><div class="container narrow auth-wrap">
      <form id="register-form" class="upload-form" novalidate>
        <div class="form-field"><label for="name">Nombre completo *</label>
          <input id="name" name="name" type="text" required maxlength="60" autocomplete="name"><small class="field-error" data-error-for="name"></small></div>
        <div class="form-field"><label for="email">Correo electrónico *</label>
          <input id="email" name="email" type="email" required maxlength="100" autocomplete="email"><small class="field-error" data-error-for="email"></small></div>
        <div class="form-field"><label for="password">Contraseña *</label>
          <input id="password" name="password" type="password" required maxlength="64" autocomplete="new-password"><small class="field-error" data-error-for="password"></small></div>
        <div class="strength" aria-hidden="true"><span id="strength-bar"></span></div>
        <small class="help-text" id="strength-text">Mínimo 8 caracteres, con mayúscula, minúscula y número.</small>
        <div class="form-field"><label for="confirm">Confirmar contraseña *</label>
          <input id="confirm" name="confirm" type="password" required maxlength="64" autocomplete="new-password"><small class="field-error" data-error-for="confirm"></small></div>
        <button class="btn btn-primary submit-button" type="submit">Crear cuenta <span>↗</span></button>
        <p class="muted auth-alt">¿Ya tienes cuenta? <a class="text-link" href="login.html">Inicia sesión</a></p>
      </form>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
