<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Banco de Apuntes</title>
  <link rel="icon" href="img/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <div id="site-header"></div>
  <main>
    <section class="page-hero compact"><div class="container">
      <span class="kicker">Bienvenido de nuevo</span><h1>Inicia <span class="gradient-text">sesión.</span></h1><p>Accede para compartir, editar y consultar tus materiales.</p></div></section>
    <section class="section"><div class="container narrow auth-wrap">
      <form id="login-form" class="upload-form" novalidate>
        <div class="form-field"><label for="email">Correo electrónico *</label>
          <input id="email" name="email" type="email" required maxlength="100" autocomplete="username"><small class="field-error" data-error-for="email"></small></div>
        <div class="form-field"><label for="password">Contraseña *</label>
          <input id="password" name="password" type="password" required maxlength="64" autocomplete="current-password"><small class="field-error" data-error-for="password"></small></div>
        <small class="field-error" id="login-error" role="alert"></small>
        <button class="btn btn-primary submit-button" type="submit">Entrar <span>↗</span></button>
        <p class="muted auth-alt">¿Aún no tienes cuenta? <a class="text-link" href="registro.html">Regístrate aquí</a></p>
      </form>
      <div class="notice-box"><strong>Cuenta de prueba (administrador):</strong><br>admin@bancodeapuntes.edu · Admin2026!<br>Tras 5 intentos fallidos la cuenta se bloquea 1 minuto.</div>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
