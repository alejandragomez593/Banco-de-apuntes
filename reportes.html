<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes | Banco de Apuntes</title>
  <link rel="icon" href="img/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reportes">
  <div id="site-header"></div>
  <main>
    <section class="page-hero compact"><div class="container">
      <span class="kicker">Estadísticas</span><h1><span class="gradient-text">Reportes</span> de la plataforma.</h1><p>Resumen de materiales, usuarios y actividad.</p></div></section>
    <section class="section"><div class="container">
      <div class="button-row no-print" style="margin-bottom:24px">
        <button class="btn btn-secondary" id="export-csv" type="button">Exportar CSV ↓</button>
        <button class="btn btn-secondary" id="print-report" type="button">Imprimir reporte</button>
      </div>
      <div class="stat-grid" id="stat-cards"></div>
      <div class="chart-grid">
        <article class="chart-card"><h3>Materiales por materia</h3><div id="chart-subject"></div></article>
        <article class="chart-card"><h3>Materiales por tipo</h3><div id="chart-type"></div></article>
        <article class="chart-card"><h3>Más vistos (aportes de la comunidad)</h3><ol id="top-views" class="top-list"></ol></article>
        <article class="chart-card" id="users-card" hidden><h3>Usuarios registrados</h3><ul id="users-list" class="top-list"></ul></article>
      </div>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
